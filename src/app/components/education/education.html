<section id="education" class="section education-section">
  <div class="container">
    <div class="section-header">
      <span class="section-label">// academic background</span>
      <h2>Education</h2>
    </div>

    <div class="education-timeline">
      @for (edu of education; track edu.degree; let last = $last) {
        <div class="edu-card">
          <div class="edu-year">{{ edu.year }}</div>
          <div class="edu-connector">
            <div class="edu-dot"></div>
            @if (!last) { <div class="edu-line"></div> }
          </div>
          <div class="edu-content card">
            <div class="edu-header">
              <div class="edu-icon"><i [class]="edu.icon"></i></div>
              <div class="edu-meta">
                <span class="edu-degree">{{ edu.degree }}</span>
                @if (edu.field) { <span class="edu-field">{{ edu.field }}</span> }
              </div>
              <div class="edu-score">
                <span class="score-value">{{ edu.score }}</span>
                <span class="score-label">{{ edu.scoreLabel }}</span>
              </div>
            </div>
            <div class="edu-institution">
              <i class="fas fa-university"></i><span>{{ edu.institution }}</span>
            </div>
            @if (edu.note) { <p class="edu-note">{{ edu.note }}</p> }
          </div>
        </div>
      }
    </div>
  </div>
</section>
