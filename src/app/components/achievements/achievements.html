<section id="achievements" class="section achievements-section">
  <div class="container">
    <div class="section-header">
      <span class="section-label">// recognition</span>
      <h2>Achievements &amp; <span>Memberships</span></h2>
    </div>

    <div class="achievements-grid">
      @for (item of achievements; track item.title) {
        <div class="achievement-card">
          <div class="ach-glow"></div>
          <div class="ach-icon-wrap"><i [class]="item.icon"></i></div>
          <div class="ach-content">
            <div class="ach-date">{{ item.date }}</div>
            <h3>{{ item.title }}</h3>
            <p class="ach-org">{{ item.org }}</p>
            <p class="ach-desc">{{ item.description }}</p>
          </div>
          <div class="ach-badge">{{ item.badgeText }}</div>
        </div>
      }
    </div>

    <div class="stats-row">
      @for (stat of stats; track stat.label) {
        <div class="stat-card">
          <div class="stat-icon"><i [class]="stat.icon"></i></div>
          <div class="stat-value">{{ stat.value }}</div>
          <div class="stat-desc">{{ stat.label }}</div>
        </div>
      }
    </div>
  </div>
</section>
